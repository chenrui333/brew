name: Commit Style

on: pull_request_target

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@ai-attribution-review-policy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_package_commit_format: false
